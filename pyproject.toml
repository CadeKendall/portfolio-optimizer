[project]
name = "portfolio-optimizer"
version = "0.1.0"
description = "Personal portfolio optimizer and backtester"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2.50",
    "PyPortfolioOpt>=1.5.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
